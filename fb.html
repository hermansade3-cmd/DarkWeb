<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <style>
        /* Mipangilio ya jumla */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #1c1e21;
            transition: direction 0.2s;
        }

        /* Sehemu ya juu (Mshale na Lugha) */
        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .back-arrow {
            position: absolute;
            left: 20px;
            top: 20px;
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
            color: #1c1e21;
        }

        /* Sehemu ya Lugha */
        .language-wrapper {
            margin-top: 5px;
            position: relative;
            display: inline-block;
        }

        .language-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-color: transparent;
            border: none;
            color: #606770;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            padding-right: 20px;
            outline: none;
            text-align: center;
        }

        .language-wrapper::after {
            content: '';
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 6px;
            height: 6px;
            border-bottom: 2px solid #606770;
            border-right: 2px solid #606770;
            pointer-events: none;
        }

        /* Sehemu ya Nembo */
        .logo-container {
            margin-top: 40px;
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
        }

        .fb-logo {
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            border: 1px solid #ccd0d5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fb-logo svg {
            width: 40px;
            height: 40px;
            fill: #1877f2;
        }

        /* Fomu */
        .login-form {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 16px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 18px 16px;
            font-size: 16px;
            border: 1px solid #ccd0d5;
            border-radius: 12px;
            outline: none;
            color: #1c1e21;
            background-color: #ffffff;
        }

        .input-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .input-group input::placeholder {
            color: #606770;
        }

        /* Vitufe */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-login {
            background-color: #1877f2;
            color: #ffffff;
            margin-top: 8px;
        }

        /* Viungo */
        .forgot-password {
            text-align: center;
            margin-top: 15px;
            font-size: 15px;
            color: #1c1e21;
            text-decoration: none;
            font-weight: 500;
        }

        /* Sehemu ya chini */
        .bottom-section {
            margin-top: auto;
            width: 100%;
            max-width: 360px;
            padding: 20px 16px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-create-account {
            background-color: #ffffff;
            color: #1877f2;
            border: 1px solid #1877f2;
        }

        .meta-logo {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #1c1e21;
            font-weight: 600;
            font-size: 18px;
            font-family: Helvetica, Arial, sans-serif;
        }

        .meta-logo svg {
            width: 24px;
            height: 24px;
            fill: #0064e0;
        }
    </style>
</head>
<body>

    <!-- Sehemu ya Juu -->
    <div class="top-bar">
        <a href="#" class="back-arrow">&#8592;</a>

        <!-- Sehemu ya Lugha -->
        <div class="language-wrapper">
            <select class="language-select" id="languageSelect">
                <option value="en">English (US)</option>
                <option value="sw" selected>Kiswahili</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="pt">Português</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>
    </div>

    <!-- Nembo ya Facebook -->
    <div class="logo-container">
        <div class="fb-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5 3.66 9.15 8.44 9.9v-7H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02z"/>
            </svg>
        </div>
    </div>

    <!-- Fomu ya Kuingia -->
    <form class="login-form" onsubmit="event.preventDefault();">
        <div class="input-group">
            <input type="text" data-i18n-placeholder="phone" placeholder="Namba ya simu au barua pepe" required>
        </div>
        <div class="input-group">
            <input type="password" data-i18n-placeholder="password" placeholder="Neno la siri (Password)" required>
        </div>

        <button type="submit" class="btn btn-login" data-i18n="login">Ingia (Log in)</button>

        <a href="#" class="forgot-password" data-i18n="forgot">Umesahau neno la siri?</a>
    </form>

    <!-- Sehemu ya Chini -->
    <div class="bottom-section">
        <button class="btn btn-create-account" data-i18n="create">Tengeneza akaunti mpya</button>

        <div class="meta-logo">
            <svg viewBox="0 0 24 24">
                <path d="M16.2 8.3c-.9-1.5-2.2-2.4-3.7-2.4-1.6 0-2.9.9-3.8 2.4C7.8 6.8 6.5 6 5 6 2.8 6 1 7.8 1 10c0 2.1 1.8 4 4 4 1.5 0 2.8-.8 3.7-2.3.9 1.5 2.2 2.3 3.8 2.3 1.6 0 2.9-.8 3.8-2.3.9 1.5 2.2 2.3 3.7 2.3 2.2 0 4-1.9 4-4 0-2.2-1.8-4-4-4-1.5 0-2.8.8-3.8 2.3zM5 12.6c-1.4 0-2.6-1.2-2.6-2.6S3.6 7.4 5 7.4c1.1 0 2 .6 2.7 1.6-.4.7-1 1.2-1.7 1.6.7.4 1.3.9 1.7 1.6-.7 1-1.6 1.6-2.7 1.6zm6.6 0c-1.1 0-2-.6-2.7-1.6.4-.7 1-1.2 1.7-1.6-.7-.4-1.3-.9-1.7-1.6.7-1 1.6-1.6 2.7-1.6 1.4 0 2.6 1.2 2.6 2.6s-1.2 2.6-2.6 2.6zm7.4 0c-1.1 0-2-.6-2.7-1.6.4-.7 1-1.2 1.7-1.6-.7-.4-1.3-.9-1.7-1.6.7-1 1.6-1.6 2.7-1.6 1.4 0 2.6 1.2 2.6 2.6s-1.2 2.6-2.6 2.6z"/>
            </svg>
            Meta
        </div>
    </div>

    <script>
        // Kamusi ya tafsiri kwa kila lugha
        const translations = {
            en: {
                phone: "Phone number or email",
                password: "Password",
                login: "Log in",
                forgot: "Forgot password?",
                create: "Create new account"
            },
            sw: {
                phone: "Namba ya simu au barua pepe",
                password: "Neno la siri (Password)",
                login: "Ingia (Log in)",
                forgot: "Umesahau neno la siri?",
                create: "Tengeneza akaunti mpya"
            },
            fr: {
                phone: "Numéro de téléphone ou e-mail",
                password: "Mot de passe",
                login: "Se connecter",
                forgot: "Mot de passe oublié ?",
                create: "Créer un nouveau compte"
            },
            es: {
                phone: "Número de teléfono o correo",
                password: "Contraseña",
                login: "Iniciar sesión",
                forgot: "¿Olvidaste tu contraseña?",
                create: "Crear cuenta nueva"
            },
            pt: {
                phone: "Número de telefone ou e-mail",
                password: "Senha",
                login: "Entrar",
                forgot: "Esqueceu a senha?",
                create: "Criar nova conta"
            },
            ar: {
                phone: "رقم الهاتف أو البريد الإلكتروني",
                password: "كلمة المرور",
                login: "تسجيل الدخول",
                forgot: "هل نسيت كلمة المرور؟",
                create: "إنشاء حساب جديد"
            },
            zh: {
                phone: "手机号或电子邮箱",
                password: "密码",
                login: "登录",
                forgot: "忘记密码？",
                create: "创建新账户"
            },
            hi: {
                phone: "फ़ोन नंबर या ईमेल",
                password: "पासवर्ड",
                login: "लॉग इन करें",
                forgot: "पासवर्ड भूल गए?",
                create: "नया खाता बनाएँ"
            }
        };

        const langSelect = document.getElementById('languageSelect');

        // Kazi ya kubadilisha lugha
        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;

            // Badilisha placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (t[key]) el.placeholder = t[key];
            });

            // Badilisha maandishi ya elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });

            // Badilisha lang attribute ya <html>
            document.documentElement.lang = lang;

            // Mwelekeo kwa Kiarabu (RTL)
            if (lang === 'ar') {
                document.body.style.direction = 'rtl';
                document.body.style.textAlign = 'right';
            } else {
                document.body.style.direction = 'ltr';
                document.body.style.textAlign = 'center';
            }

            // Hifadhi chaguo kwenye localStorage (hiari)
            try { localStorage.setItem('preferredLang', lang); } catch (e) {}
        }

        // Sikiliza mabadiliko ya lugha
        langSelect.addEventListener('change', function () {
            applyLanguage(this.value);
        });

        // Pakia lugha iliyohifadhiwa au tumia Kiswahili kama default
        (function init() {
            let saved = null;
            try { saved = localStorage.getItem('preferredLang'); } catch (e) {}
            const initial = saved && translations[saved] ? saved : 'sw';
            langSelect.value = initial;
            applyLanguage(initial);
        })();
    </script>

</body>
</html>
