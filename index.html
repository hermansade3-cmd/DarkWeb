<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Access</title>
<style>
:root{--bg:#020a05;--g:#00ff66;--g2:#00b34a;--dim:#4f9c70;--txt:#c9ffe0;--warn:#ffcc00;--red:#ff4466}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Courier New",ui-monospace,Menlo,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background-image:repeating-linear-gradient(0deg,rgba(0,255,102,.03) 0 1px,transparent 1px 3px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.18;pointer-events:none}
.box{position:relative;z-index:2;width:min(420px,92%);text-align:center;padding:24px}
.ring{width:140px;height:140px;margin:0 auto 20px;border-radius:50%;border:2px solid var(--g2);position:relative;box-shadow:0 0 30px rgba(0,255,102,.3),inset 0 0 30px rgba(0,255,102,.1);animation:pulse 2.5s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed var(--g);opacity:.5;animation:spin 8s linear infinite}
.ring::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(0,255,102,.6) 85%,transparent 100%);animation:spin 1.8s linear infinite;mask:radial-gradient(circle,transparent 60%,#000 61%)}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(0,255,102,.3),inset 0 0 30px rgba(0,255,102,.1)}50%{box-shadow:0 0 50px rgba(0,255,102,.6),inset 0 0 40px rgba(0,255,102,.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;filter:drop-shadow(0 0 8px var(--g))}
h1{color:var(--g);font-size:clamp(20px,6vw,28px);letter-spacing:3px;margin:0 0 6px;text-shadow:0 0 12px var(--g)}
.sub{color:var(--dim);font-size:12px;letter-spacing:1px;margin:0 0 22px}
.bar{height:6px;background:#000;border:1px solid var(--g2);border-radius:4px;overflow:hidden;margin:0 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g));box-shadow:0 0 8px var(--g);animation:load 2.4s ease-out forwards}
@keyframes load{to{width:100%}}
.stat{color:var(--dim);font-size:11px;min-height:16px;letter-spacing:1px}
.enter{margin-top:22px;display:inline-block;border:1px solid var(--g);color:var(--g);padding:14px 30px;border-radius:8px;text-decoration:none;font-weight:bold;letter-spacing:2px;font-size:14px;transition:.3s;opacity:0;animation:fadein .6s ease 2.4s forwards;position:relative;overflow:hidden}
.enter:hover{background:var(--g);color:#000;box-shadow:0 0 20px var(--g)}
@keyframes fadein{to{opacity:1}}
.enter::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 2.5s infinite}
@keyframes shine{to{left:100%}}
.warn{color:var(--warn);font-size:10px;margin-top:18px;letter-spacing:1px;opacity:.6}
.glitch{animation:gl 4s infinite}
@keyframes gl{0%,90%,100%{transform:none}92%{transform:translateX(-2px);text-shadow:2px 0 var(--red),-2px 0 #4db8ff}94%{transform:translateX(2px);text-shadow:-2px 0 var(--red),2px 0 #4db8ff}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.enter{opacity:1}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="box">
  <div class="ring">
    <div class="lock">🔐</div>
  </div>
  <h1 class="glitch">&gt; SYSTEM_ACCESS</h1>
  <p class="sub">SECURE GATEWAY · v2.0.4</p>
  <div class="bar"><i></i></div>
  <div class="stat" id="stat">Inaanzisha…</div>
  <a class="enter" href="cyber.html">🔓 INGIA</a>
  <div class="warn">⚠️ Bandwidth encrypted · Node: TZ-01</div>
</div>
<script>
const $=id=>document.getElementById(id);
const msgs=["Inaanzisha moduli…","Inakagua node…","Encryption handshake…","Uthibitisho wa mfumo…","Tayari."];
let i=0;
const t=setInterval(()=>{
  $("stat").textContent=msgs[i]||"Tayari.";
  i++;
  if(i>msgs.length){clearInterval(t);$("stat").textContent="✅ Mfumo uko tayari."}
},550);
(function(){const c=$("bg"),x=c.getContext("2d");if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;let w,h,y;function sz(){w=c.width=innerWidth;h=c.height=innerHeight;y=Array(Math.floor(w/16)).fill(0).map(()=>Math.random()*h/16)}sz();addEventListener("resize",sz);setInterval(()=>{x.fillStyle="rgba(2,10,5,.15)";x.fillRect(0,0,w,h);x.fillStyle="#00ff66";x.font="14px monospace";y.forEach((v,i)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*95),i*16,v*16);y[i]=v*16>h&&Math.random()>.975?0:v+1})},70)})();
</script>
</body>
</html>
